name: Exact CAD
on: [push, pull_request]
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r cad/requirements.txt
      - run: python -m unittest discover -s cad -p 'test_*.py'
